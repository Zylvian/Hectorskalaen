name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install ratings API dependencies
        working-directory: api
        run: npm install
      - name: Configure Turso on the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python3 << 'PY'
          import json, os, urllib.request
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          url = os.environ.get("TURSO_DATABASE_URL") or ""
          auth = os.environ.get("TURSO_AUTH_TOKEN") or ""
          if not url or not auth:
              print("Turso GitHub secrets are not set; ratings will not persist")
              raise SystemExit(0)
          env_vars = {
              "TURSO_DATABASE_URL": {"type": "secret_text", "value": url},
              "TURSO_AUTH_TOKEN": {"type": "secret_text", "value": auth},
          }
          flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
          body = {
              "deployment_configs": {
                  "production": {
                      "compatibility_date": "2026-09-24",
                      "compatibility_flags": flags,
                      "env_vars": env_vars,
                  },
                  "preview": {
                      "compatibility_date": "2026-09-24",
                      "compatibility_flags": flags,
                      "env_vars": env_vars,
                  },
              }
          }
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/hectorskalaen",
              data=json.dumps(body).encode(),
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              payload = json.load(resp)
          if not payload.get("success"):
              raise SystemExit("Failed to set Pages environment variables")
          print("Turso environment variables updated")
          PY
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src --project-name=hectorskalaen
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
