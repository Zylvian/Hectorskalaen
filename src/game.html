<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080d" />
    <title>Hectorskalaen – Gjett luktscore</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-root">
      <header class="app-header">
        <div class="header-brand">
          <p class="eyebrow">Gjett folkets snitt</p>
          <a class="header-home" href="index.html" aria-label="Til forsiden">
            <h1>Hectorskalaen</h1>
          </a>
          <p class="tagline">
            Gjett hvordan folket har rangert lukta — 1 er friskt, 10 er piss.
          </p>
        </div>
        <div class="header-actions">
          <a class="about-toggle" href="info.html" aria-label="Om Hectorskalaen">?</a>
          <nav class="header-nav" aria-label="Sider">
            <a class="nav-link" href="index.html">Barer</a>
            <a class="nav-link is-active" href="game.html">Spill</a>
            <a class="nav-link nav-link-info" href="info.html">Info</a>
          </nav>
        </div>
      </header>

      <main class="app-main">
        <section class="panel panel-game" data-mode="game">
          <header class="panel-header panel-header-game">
            <div>
              <h2>Gjett Hectorskalaen</h2>
              <p class="results-summary" id="gameSummary">
                Velg et tall mellom 1 og 10.
              </p>
            </div>
          </header>

          <div class="game-area">
            <div class="game-card" id="gameCard">
              <div class="game-image" id="gameImage"></div>
              <div class="game-info">
                <h3 id="gameTitle"></h3>
                <p id="gameHint" class="game-hint"></p>
                <div class="game-input-row">
                  <label for="guessInput" class="sr-only">Ditt gjett</label>
                  <input
                    id="guessInput"
                    type="number"
                    min="1"
                    max="10"
                    placeholder="1–10"
                    autocomplete="off"
                  />
                  <button id="guessSubmit" class="btn-ghost" type="button">Gjett</button>
                </div>
                <p id="guessFeedback" class="guess-feedback"></p>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <p>
          For uenigheter:
          <a href="mailto:etmeg@hectorskalaen.no">etmeg@hectorskalaen.no</a>
        </p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
